<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="chamapp">
<meta name="theme-color" content="#0b0c0e">
<meta name="robots" content="noindex">
<title>chamapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a native-feeling iPhone food app. Large-title screens, a floating glass tab bar with a raised add button,
   Fitness-style rings for the day, and every dish shown as a big food tile on a warm gradient plate (or the user's photo).
   Deliberately dark-only, matching Dima's own Foodboxd / Tasteboxd apps. */
:root{
  color-scheme:dark;
  /* color */
  --bg:#0b0c0e; --s1:#16171a; --s2:#1e1f23; --s3:#2a2b30;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#f5f5f7; --tx2:#a3a3ab; --tx3:#6c6c74;
  --green:#30d158; --green-d:#1fae47; --ember:#ff6a3d; --amber:#ffb340; --cyan:#40c8ff; --red:#ff453a; --violet:#bf5af2; --blue:#0a84ff; --wolt:#009de0;
  --m-breakfast:var(--amber); --m-lunch:var(--green); --m-dinner:var(--blue); --m-bedtime:var(--violet);
  /* type */
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --tab-h:66px;
}
*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.42 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::after{content:"";position:fixed;inset:0 0 auto;height:340px;pointer-events:none;z-index:-1;background:radial-gradient(70% 100% at 15% 0%,rgba(255,106,61,.13),transparent 70%),radial-gradient(60% 90% at 95% 0%,rgba(48,209,88,.08),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:0 0 auto;display:block}
.muted{color:var(--tx2)}
.sp{flex:1}

/* compact nav that appears on scroll */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);pointer-events:none;transition:background .2s,border-color .2s;border-bottom:1px solid transparent}
.nav.on{background:rgba(14,15,17,.78);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border-bottom-color:var(--line)}
.nav .in{height:46px;display:flex;align-items:center;justify-content:center}
.nav .t{font-weight:700;font-size:16px;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
.nav.on .t{opacity:1;transform:none}

.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab-h) + 44px + env(safe-area-inset-bottom,0px))}
.view.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

/* large title */
.lt{display:flex;align-items:flex-end;gap:12px;padding-top:58px;margin-bottom:16px}
.lt-tx{flex:1;min-width:0}
.kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
h1{margin:2px 0 0;font:900 32px/1.08 var(--f-round);letter-spacing:-.01em;text-wrap:balance}
.lead{margin:-6px 0 16px;color:var(--tx2);max-width:52ch}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 10px}
.sec h2{margin:0;font:800 20px/1.2 var(--f-round)}
.sec span{color:var(--tx3);font-size:13px;font-weight:600}

/* surfaces + controls */
.card{background:var(--s1);border-radius:22px;border:1px solid var(--line)}
.list{background:var(--s1);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.cbtn{appearance:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--s2);color:var(--tx);display:grid;place-items:center;flex:0 0 auto}
.cbtn:active{transform:scale(.92)}
.cbtn.green{background:var(--green);color:#04150a}
.btn{appearance:none;border:0;background:var(--s2);color:var(--tx);border-radius:14px;min-height:46px;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--green);color:#04150a}
.btn.danger{background:rgba(255,69,58,.12);color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.txtbtn{appearance:none;border:0;background:none;color:var(--tx2);font-weight:600;font-size:16px;padding:8px 4px;min-height:44px}
.txtbtn.strong{color:var(--green);font-weight:800}
.txtbtn.red{color:var(--red)}
.back{appearance:none;border:0;background:none;color:var(--green);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:2px;padding:0;margin-top:56px;margin-left:-6px;min-height:36px}
.back + .lt{padding-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;font-family:var(--f-round)}
.pill .ic{width:13px;height:13px;stroke-width:3}
.pill.ok{background:rgba(48,209,88,.15);color:var(--green)}
.pill.low{background:rgba(255,179,64,.15);color:var(--amber)}
.pill.high{background:rgba(255,69,58,.15);color:var(--red)}
.pill.mute{background:var(--s2);color:var(--tx2)}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;border:1px solid transparent;border-radius:14px;background:var(--s2);padding:11px 14px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.14)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
textarea{resize:vertical;line-height:1.45}
.ck{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;color:transparent;flex:0 0 auto;transition:background .15s,border-color .15s,transform .15s}
.ck .ic{width:16px;height:16px;stroke-width:3}
.ck.on{background:var(--green);border-color:var(--green);color:#04150a;animation:pop .25s}
.ck:disabled{opacity:.35}
@keyframes pop{50%{transform:scale(1.18)}}
.empty{border:1.5px dashed var(--line2);border-radius:22px;padding:30px 20px;text-align:center;color:var(--tx2)}
.empty strong{display:block;color:var(--tx);font:800 18px var(--f-round);margin-bottom:4px}

/* food tiles */
.tile{--c1:#ff9f0a;--c2:#ff375f;position:relative;overflow:hidden;display:grid;place-items:center;flex:0 0 auto;
  background:radial-gradient(110% 85% at 28% 12%,color-mix(in srgb,var(--c1) 58%,transparent),transparent 62%),linear-gradient(150deg,color-mix(in srgb,var(--c1) 30%,#1b1c20),color-mix(in srgb,var(--c2) 26%,#111215))}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);pointer-events:none}
.tile .em{line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ic{width:40%;height:40%}
.tile.sm{width:48px;height:48px;border-radius:14px;font-size:26px}
.tile.md{width:76px;height:76px;border-radius:20px;font-size:42px}
.tile.card{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:22px;font-size:clamp(46px,15vw,72px)}
.tile.tall{width:148px;height:176px;border-radius:22px;font-size:70px}
.tile.hero{width:100%;height:290px;border-radius:0;font-size:124px}
.tile.ph{background:var(--s2);color:var(--tx3)}
.tile.ph::after{box-shadow:none;border:1.5px dashed var(--line2)}

/* rows */
.row{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;appearance:none;border:0;background:transparent}
.row + .row::before{content:"";position:absolute;top:0;left:74px;right:0;height:1px;background:var(--line)}
button.row:active{background:rgba(255,255,255,.04)}
.row-tx{min-width:0;display:grid;gap:1px}
.ml{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--m,var(--tx2))}
.nm{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.ph{color:var(--tx3);font-weight:600}
.sub{font-size:13px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc{font:800 15px var(--f-round);color:var(--tx2);font-variant-numeric:tabular-nums}
.chev{color:var(--tx3)}
.m-breakfast{--m:var(--m-breakfast)}.m-lunch{--m:var(--m-lunch)}.m-dinner{--m:var(--m-dinner)}.m-bedtime{--m:var(--m-bedtime)}

/* today */
.sum{display:grid;grid-template-columns:136px minmax(0,1fr);gap:18px;align-items:center;padding:18px}
.rings{width:136px;height:136px;display:block}
.legend{display:grid;gap:12px;min-width:0}
.lg{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center}
.lg-v{font:900 21px/1 var(--f-round);font-variant-numeric:tabular-nums;white-space:nowrap}
.lg-v small{font:700 12px var(--f-body);color:var(--tx2);margin-left:3px}
.lg-l{font-size:12px;color:var(--tx2);font-weight:600;margin-top:2px}
.sum-foot{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--tx2)}
.next{margin-top:14px;padding:16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--m) 16%,var(--s1)),var(--s1) 60%);border-color:color-mix(in srgb,var(--m) 25%,transparent)}
.next h3{margin:3px 0 2px;font:800 21px/1.15 var(--f-round);text-wrap:balance}
.next .kick{color:var(--m)}
.next-act{grid-column:1/-1;display:flex;gap:8px}
.next-act .btn{flex:1;padding:0 12px;white-space:nowrap}
.next-act .btn.primary{flex:1.5}
.next-tile{appearance:none;border:0;background:none;padding:0;border-radius:20px}
.meal .row-main{appearance:none;border:0;background:none;padding:0;text-align:left;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.meal{grid-template-columns:minmax(0,1fr) auto auto}
.meal .sub b{color:var(--tx);font-family:var(--f-round)}
.meal.done .nm{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--tx3)}
.meal.done .tile{opacity:.55}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{scroll-snap-align:start}
.qchip{appearance:none;border:1px solid var(--line2);background:var(--s1);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.qchip b{font-family:var(--f-round);color:var(--tx2);font-weight:800}
.qchip .ic{width:16px;height:16px;color:var(--green)}
.qchip:active{transform:scale(.96)}
.xrow{grid-template-columns:minmax(0,1fr) auto auto}
.xbtn{appearance:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--s2);color:var(--tx2);display:grid;place-items:center}
.xbtn .ic{width:15px;height:15px}
.water{padding:16px;display:grid;gap:14px}
.w-top{display:flex;align-items:center;gap:12px}
.w-ic{width:44px;height:44px;border-radius:14px;background:rgba(64,200,255,.14);color:var(--cyan);display:grid;place-items:center}
.big{font:900 28px/1 var(--f-round);font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--tx2);font-weight:800}
.rbtn{appearance:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--s2);color:var(--tx);display:grid;place-items:center}
.rbtn.add{background:var(--cyan);color:#001a26}
.rbtn:active{transform:scale(.92)}
.cups{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.cup{appearance:none;height:30px;border-radius:7px;border:0;background:var(--s2);padding:0;transition:background .15s}
.cup.on{background:linear-gradient(180deg,#7ad8ff,#1aa8f0)}
.wt{padding:16px;display:grid;gap:12px}
.wt-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.chart{position:relative;height:120px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(255,106,61,.25)}
.chart .goal{position:absolute;right:0;transform:translateY(-125%);font-size:11px;font-weight:800;color:var(--green);font-family:var(--f-round)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:-4px}
.wt-form{display:flex;gap:8px}
.wt-form input{flex:1;min-width:0}

/* recipes */
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:18px;height:18px}
.search input{padding-left:38px;background:var(--s1);border-color:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:0;background:var(--s1);color:var(--tx2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--m)}
.chip .ic{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.banner{appearance:none;width:100%;margin-top:16px;border:1px solid rgba(48,209,88,.25);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:linear-gradient(120deg,rgba(48,209,88,.16),rgba(64,200,255,.08) 70%),var(--s1)}
.banner .bi{width:48px;height:48px;border-radius:14px;background:rgba(48,209,88,.18);color:var(--green);display:grid;place-items:center}
.banner .bi .ic{width:24px;height:24px}
.banner strong{display:block;font:800 16px var(--f-round)}
.banner span span{font-size:13px;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rc{appearance:none;border:0;background:none;padding:0;text-align:left;display:grid;gap:7px;align-content:start;min-width:0}
.rc:active .tile{transform:scale(.97)}
.rc .tile{transition:transform .15s}
.rc-nm{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rc-sub{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ov-chip{position:absolute;left:8px;bottom:8px;z-index:1;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:800 12px var(--f-round);color:#fff}
.ov-bm{position:absolute;right:8px;top:8px;z-index:1;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--amber);display:grid;place-items:center}
.ov-bm .ic{width:14px;height:14px}
.ov-beef{position:absolute;left:8px;top:8px;z-index:1;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#ffb3a7}
.tallcard{width:148px;flex:0 0 148px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.star{width:13px;height:13px;display:block}
.kpanel{padding:16px}
.kcat + .kcat{margin-top:14px}
.kcat h3{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.kchips{display:flex;flex-wrap:wrap;gap:7px}
.kchip{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--tx2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.kchip[aria-pressed="true"]{background:rgba(48,209,88,.15);border-color:rgba(48,209,88,.5);color:var(--green)}
.bar{height:6px;border-radius:999px;background:var(--s3);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:var(--green)}
.krow .row-tx{gap:4px}

/* week */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:6px;align-content:start}
.st .l{font-size:12px;font-weight:700;color:var(--tx2)}
.st .v{font:900 24px/1 var(--f-round);font-variant-numeric:tabular-nums}
.st .v small{font-size:13px;color:var(--tx2);font-weight:800}
.dots7{display:flex;gap:5px}
.dots7 i{width:10px;height:10px;border-radius:50%;background:var(--st,var(--s3))}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:22px}
.dy{appearance:none;border:0;background:var(--s1);border-radius:16px;padding:9px 0 9px;display:grid;justify-items:center;gap:3px;color:var(--tx2);min-width:0}
.dy .w{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.dy .n{font:900 19px/1 var(--f-round);color:var(--tx)}
.dy .d{width:6px;height:6px;border-radius:50%;background:var(--st,var(--s3))}
.dy.today .w{color:var(--green)}
.dy[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.dy[aria-pressed="true"] .n{color:var(--bg)}
.dy.today[aria-pressed="true"] .w{color:var(--green-d)}
.wk-actions{display:grid;gap:8px;margin-top:20px}

/* shop */
.prog{padding:16px;display:grid;gap:10px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wolt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:20px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#00a8ef,#0077b8);box-shadow:0 12px 28px rgba(0,157,224,.25);margin-top:12px}
.wolt .wi{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:0 0 auto}
.wolt strong{display:block;font:800 16px var(--f-round)}
.wolt span span{font-size:13px;opacity:.85}
.wolt .ic.arr{margin-left:auto}
.srow{grid-template-columns:auto minmax(0,1fr) auto auto;cursor:pointer}
.srow + .srow::before{left:58px}
.srow.done .nm{color:var(--tx3);text-decoration:line-through}
.srow .q{font:800 14px var(--f-round);color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.wmini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(0,157,224,.14);color:var(--wolt);text-decoration:none}
.wmini .ic{width:16px;height:16px}

  const read = k => { try { const v = localStorage.getItem(P + k); return v == null ? undefined : JSON.parse(v); } catch { return undefined; } };
  const writeLS = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch { throw {code:"quota_exceeded"}; } };
  const keys = () => { const out = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(P) && !k.startsWith(P + "__")) out.push(k.slice(P.length)); } return out; };
  const SEEDV = SEED.version || 1;
  try {
    if (!read("__seeded")){
      for (const [id, r] of Object.entries(SEED.recipes)) writeLS("recipes/" + id, r);
      writeLS("plan/week", SEED.plan); writeLS("pantry/main", {items:[]}); writeLS("__seeded", 1); writeLS("__seedv", SEEDV);
    } else if ((read("__seedv") || 1) < SEEDV){
      // App update: add new recipes and videos, never overwrite your edits or bring back recipes you deleted.
      const gone = new Set(read("__deleted") || []);
      for (const [id, r] of Object.entries(SEED.recipes)){
        const cur = read("recipes/" + id);
        if (cur === undefined){ if (!gone.has(id)) writeLS("recipes/" + id, r); }
        else if (!cur.video && r.video) writeLS("recipes/" + id, {...cur, video:r.video});
      }
      writeLS("__seedv", SEEDV);
    }
  } catch {}
  const docL = new Map(), colL = new Map();
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const meta = {fromCache:false, hasPendingWrites:false};
  const docSnap = path => { const v = read(path); return {id:path.split("/").pop(), exists:v !== undefined, data:() => clone(v), metadata:meta}; };
  const colSnap = c => { const docs = keys().filter(k => k.startsWith(c + "/") && k.split("/").length === 2).sort().map(docSnap); return {docs, size:docs.length, empty:!docs.length, docChanges:() => [], metadata:meta}; };
  const notify = path => setTimeout(() => { (docL.get(path) || []).forEach(f => f(docSnap(path))); const c = path.split("/")[0]; (colL.get(c) || []).forEach(f => f(colSnap(c))); }, 0);
  const sub = (map, key, fn, snap) => { map.set(key, [...(map.get(key) || []), fn]); setTimeout(() => fn(snap()), 0); return () => map.set(key, (map.get(key) || []).filter(x => x !== fn)); };
  const db = {
    doc: path => ({
      id:path.split("/").pop(), path,
      get: async () => docSnap(path),
      set: async d => { writeLS(path, d); notify(path); },
      update: async d => { const cur = read(path); if (cur === undefined) throw {code:"invalid_argument"}; writeLS(path, {...cur, ...d}); notify(path); },
      delete: async () => { localStorage.removeItem(P + path); if (path.startsWith("recipes/")){ try { writeLS("__deleted", [...new Set([...(read("__deleted") || []), path.slice(8)])]); } catch {} } notify(path); },
      onSnapshot: fn => sub(docL, path, fn, () => docSnap(path)),

    collection: c => ({ onSnapshot: fn => sub(colL, c, fn, () => colSnap(c)) }),
  };

  // photos
  const urls = {};
  let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("chamapp", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("photos", mode); fn(t.objectStore("photos")); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
  const allPhotos = async () => { const d = await idb(); return new Promise((res, rej) => { const out = []; const c = d.transaction("photos").objectStore("photos").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur){ out.push([cur.key, cur.value]); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); };
  const loadPhotos = (async () => { try { for (const [id, blob] of await allPhotos()) urls[id] = URL.createObjectURL(blob); } catch {} })();
  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
  const assets = {
    upload: async blob => { const id = rid(); try { await tx("readwrite", s => s.put(blob, id)); } catch { throw {code:"quota_or_state"}; } urls[id] = URL.createObjectURL(blob); return {id, url:urls[id], sizeBytes:blob.size, contentType:blob.type}; },

    },

  let next = "";
  if (!nm){
    next = `<section class="card next m-lunch"><span class="tile md" style="--c1:#30d158;--c2:#40c8ff;color:#fff">${ic("check")}</span><div><p class="kick">All four meals done</p><h3>Planned and eaten</h3><p class="muted" style="margin:0">Log anything extra below.</p></div></section>`;
  } else {

    next = r ? `<section class="card next m-${nm.key}">
        ${r.id !== "out" ? `<button class="next-tile" data-open="${esc(r.id)}" aria-label="Open ${esc(r.name)}">${tile(r, "md")}</button>` : tile(r, "md")}

        <div class="next-act"><button class="btn primary" data-log="${nm.key}">${ic("check")} Log it</button><button class="btn" data-pick="${todayDay}|${nm.key}">${ic("swap")} Swap</button>${r.id !== "out" ? `<button class="btn" data-open="${esc(r.id)}">Recipe</button>` : ""}</div>
      </section>`
      : `<section class="card next m-${nm.key}"><span class="tile md ph">${ic("plus")}</span><div><p class="kick">Up next · ${nm.label} · ${nm.time}</p><h3>Nothing planned yet</h3></div><div class="next-act"><button class="btn primary" data-pick="${todayDay}|${nm.key}">Choose ${nm.label.toLowerCase()}</button></div></section>`;
  }

  const rows = MEALS.map(m => {
    const e = eatInfo(m.key); const r = e ? e.r : getRec(slots[m.key]); const on = !!e;
    const target = r && r.id !== "out" && S.recipes[r.id] ? `data-open="${esc(r.id)}"` : `data-pick="${todayDay}|${m.key}"`;
    return `<div class="row meal m-${m.key} ${on ? "done" : ""}">
      <button class="row-main" ${target}>${r ? tile(r, "sm") : `<span class="tile sm ph">${ic("plus")}</span>`}<span class="row-tx"><span class="ml">${m.label}</span><span class="nm ${r ? "" : "ph"}">${r ? esc(r.name) : "Choose a dish"}</span>${r ? `<span class="sub"><b class="num">${fmt(e ? e.kcal : r.kcal)}</b> kcal${e && e.note ? ` · <span style="color:var(--amber)">${esc(e.note)}</span>` : ""}</span>` : ""}</span></button>
      ${!on ? `<button class="swapb" data-pick="${todayDay}|${m.key}" aria-label="Swap ${m.label}">${ic("swap")}</button>` : ""}
      <button class="ck ${on ? "on" : ""}" data-log="${m.key}" aria-label="${on ? "Edit what you ate for " + m.label : "Log " + m.label}" aria-pressed="${on}" ${r ? "" : "disabled"}>${ic("check")}</button>
    </div>`;
  }).join("");

  const quick = `<button class="qchip drink" id="x-drink">${ic("cup")}<span class="t">Log a drink</span></button>`
    + S.drinks.map((d, i) => `<button class="qchip drink" data-sdrink="${i}">${ic("plus")}<span class="t">${esc(d.name)}</span> <b>${fmt(d.kcal)}</b></button>`).join("")
    + PRESETS.map(([n, k]) => `<button class="qchip" data-quick="${esc(n)}|${k}">${ic("plus")}<span class="t">${esc(n)}</span> <b>${k}</b></button>`).join("")
    + `<button class="qchip" id="x-custom">Something else…</button>`;
  const extras = S.log.extras.map((x, i) => `<div class="row xrow"><span class="row-tx"><span class="nm">${esc(x.name)}</span></span><span class="kc">${fmt(x.kcal)}</span><button class="xbtn" data-rmx="${i}" aria-label="Remove ${esc(x.name)}">${ic("x")}</button></div>`).join("");
  const cups = Array.from({length:WATER_CUPS}, (_, i) => `<button class="cup ${i < w ? "on" : ""}" data-water="${i+1}" aria-label="${(i+1)*250} ml"></button>`).join("");

  const soon = S.trips.filter(t => t.status !== "done" && t.date <= addDays(todayKey, 1)).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))[0];
  const tripBanner = soon ? (() => { const n = (soon.items || []).length, got = (soon.items || []).filter(i => i.done).length; return `<button class="card tripcard" data-trip="${esc(soon.id)}"><span class="ti">${ic("bag")}</span><span class="row-tx"><span class="kick" style="color:var(--wolt)">${soon.date < todayKey ? "Not logged yet" : "Shopping"} · ${esc(whenLabel(soon))}</span><span class="nm">${esc(soon.store || "Shopping list")}</span><span class="sub">${n} items · ${got} in the basket</span></span>${ic("right", "chev")}</button>`; })() : "";
  view.innerHTML = head + summary + next + tripBanner + `
    <div class="sec"><h2>Today's meals</h2><span>Resets at 5 am</span></div>
    <div class="list">${rows}</div>
    <div class="sec"><h2>Drinks & extras</h2><span>${xK ? fmt(xK) + " kcal logged" : "Tap to log"}</span></div>
    <div class="hscroll">${quick}</div>
    ${extras ? `<div class="list" style="margin-top:10px">${extras}</div>` : ""}
    <div class="sec"><h2>Water</h2><span>${w} of ${WATER_CUPS} glasses</span></div>
    <div class="card water">
      <div class="w-top"><span class="w-ic">${ic("drop")}</span><div style="flex:1"><div class="big">${litres(w)} <small>L</small></div><div class="muted" style="font-size:13px">of 3 L today</div></div>
        <button class="rbtn" id="w-minus" aria-label="Remove a glass">${ic("minus")}</button><button class="rbtn add" id="w-plus" aria-label="Add a glass">${ic("plus")}</button></div>
      <div class="cups">${cups}</div>
    </div>
    <div class="sec"><h2>Weight</h2><span>Goal ${GOAL_KG} kg</span></div>
    ${weightCard()}
    <div class="sec"><h2>Your data</h2><span>Saved on this phone</span></div>
    <section class="card" style="padding:16px;display:grid;gap:12px"><p class="muted" style="margin:0;font-size:14px">Everything lives on this phone only. Save a backup to Files now and then, so a new phone or a cleared Safari never loses it.</p>
      <div style="display:flex;gap:8px"><button class="btn" id="bk-save" style="flex:1">Save backup</button><label class="btn" style="flex:1">Restore<input type="file" accept="application/json,.json" id="bk-load" hidden></label></div></section>`;

  view.querySelectorAll("[data-log]").forEach(b => b.onclick = () => openLogMeal(b.dataset.log));
  view.querySelectorAll("[data-trip]").forEach(b => b.onclick = () => openTrip(b.dataset.trip));
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openRecipe(b.dataset.open));
  view.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const [d, m] = b.dataset.pick.split("|"); openPicker(d, m); });
  view.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => { const [n, k] = b.dataset.quick.split("|"); S.log.extras = [...S.log.extras, {name:n, kcal:+k}]; saveLog(); toast(`Logged ${n} · ${k} kcal`); });
  view.querySelectorAll("[data-sdrink]").forEach(b => b.onclick = () => { const d = S.drinks[+b.dataset.sdrink]; if (!d) return; S.log.extras = [...S.log.extras, {name:d.name, kcal:d.kcal, protein:d.protein || 0, kind:"drink"}]; saveLog(); toast(`Logged ${d.name}`); });
  view.querySelector("#x-drink").onclick = openDrink;
  view.querySelectorAll("[data-rmx]").forEach(b => b.onclick = () => { S.log.extras = S.log.extras.filter((_, i) => i !== +b.dataset.rmx); saveLog(); });
  view.querySelectorAll("[data-water]").forEach(b => b.onclick = () => { const n = +b.dataset.water; S.log.water = S.log.water === n ? n - 1 : n; saveLog(); });
  view.querySelector("#w-plus").onclick = () => { S.log.water = Math.min(WATER_CUPS, (S.log.water || 0) + 1); saveLog(); };
  view.querySelector("#w-minus").onclick = () => { S.log.water = Math.max(0, (S.log.water || 0) - 1); saveLog(); };
  view.querySelector("#x-custom").onclick = openExtra;
  view.querySelector("#wt-form").onsubmit = e => {
    e.preventDefault();
    const v = parseFloat(String(view.querySelector("#wt-in").value).replace(",", "."));
    if (!(v > 30 && v < 250)){ toast("Enter your weight in kg, like 88.4"); return; }
    const doc = {kg:Math.round(v*10)/10, date:todayKey};
    S.weights = [...S.weights.filter(x => x.date !== todayKey), doc].sort((a, b) => a.date.localeCompare(b.date));
    write("weights/" + todayKey, doc); toast("Weigh-in saved"); renderToday();
  };
  view.querySelector("#bk-save").onclick = async () => { try { if (await window.__backup.save()) toast("Backup ready"); } catch { toast("Couldn't make the backup"); } };
  const bl = view.querySelector("#bk-load");
  bl.onchange = async () => { const f = bl.files[0]; if (!f) return; try { await window.__backup.restore(f); toast("Backup restored"); setTimeout(() => location.reload(), 600); } catch { toast("That file isn't a chamapp backup"); } };
}
function weightCard(){
  const ws = S.weights; const last = ws[ws.length - 1]; const first = ws[0];
  let chart = "";
  if (ws.length > 1){
    const W = 300, H = 120, t0 = Date.parse(first.date), t1 = Date.parse(last.date);
    const kgs = ws.map(x => x.kg).concat(GOAL_KG); const lo = Math.min(...kgs) - 1, hi = Math.max(...kgs) + 1;
    const X = d => (Date.parse(d) - t0) / Math.max(t1 - t0, 1) * W;
    const Y = k => 8 + (hi - k) / (hi - lo) * (H - 16);
    const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`);
    const mon = d => new Date(d + "T12:00").toLocaleDateString("en-GB", {month:"short", year:"numeric"});
    chart = `<div class="chart">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weight from ${first.kg} kg to ${last.kg} kg">
        <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></linearGradient></defs>
        <line x1="0" x2="${W}" y1="${H*.33}" y2="${H*.33}" stroke="rgba(255,255,255,.05)" vector-effect="non-scaling-stroke"/>
        <line x1="0" x2="${W}" y1="${H*.66}" y2="${H*.66}" stroke="rgba(255,255,255,.05)" vector-effect="non-scaling-stroke"/>
        <path d="M${pts.join(" L")} L${W},${H} L0,${H} Z" fill="url(#ga)"/>
        <line x1="0" x2="${W}" y1="${Y(GOAL_KG)}" y2="${Y(GOAL_KG)}" stroke="#30d158" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke" opacity=".8"/>
        <polyline points="${pts.join(" ")}" fill="none" stroke="#ff6a3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="goal" style="top:${(Y(GOAL_KG)/H*100).toFixed(1)}%">Goal ${GOAL_KG} kg</span>
      <span class="dot" style="left:${(X(last.date)/W*100).toFixed(1)}%;top:${(Y(last.kg)/H*100).toFixed(1)}%"></span>
    </div>
    <div class="axis"><span>${mon(first.date)}</span><span>${mon(last.date)}</span></div>`;
  }
  const toGoal = last ? last.kg - GOAL_KG : 0;
  return `<section class="card wt">
    <div class="wt-top">${last ? `<span class="big">${last.kg.toFixed(1)} <small>kg</small></span><span class="pill ${toGoal > 0 ? "low" : "ok"}">${toGoal > 0 ? toGoal.toFixed(1) + " kg to goal" : "Goal reached"}</span><span class="sp"></span><span class="muted" style="font-size:13px">${esc(new Date(last.date + "T12:00").toLocaleDateString("en-GB", {day:"numeric", month:"short"}))}</span>` : `<span class="muted">No weigh-ins yet. Log your first one below.</span>`}</div>
    ${chart}
    <form class="wt-form" id="wt-form"><input type="number" step="0.1" inputmode="decimal" id="wt-in" placeholder="Today's weight in kg" aria-label="Today's weight in kg"><button class="btn primary" type="submit">Log</button></form>
  </section>`;
}

// ---------- RECIPES ----------
function rcard(r){
  const extra = `<span class="ov-chip">${fmt(r.kcal)} kcal</span>${r.saved ? `<span class="ov-bm">${ic("bookmark", "", true)}</span>` : ""}${isBeef(r) ? `<span class="ov-beef">Beef</span>` : ""}`;
  return `<button class="rc" data-open="${esc(r.id)}">${tile(r, "card", extra)}<span class="rc-nm">${esc(r.name)}</span><span class="rc-sub"><span class="num">${fmt(r.protein)} g protein</span>${r.rating ? `<span class="stars">${stars(r.rating)}</span>` : ""}</span></button>`;
}
function renderRecipes(){
  const n = Object.keys(S.recipes).length;
  const head = `<div class="lt"><div class="lt-tx"><p class="kick">${n} dishes</p><h1>Recipes</h1></div><button class="cbtn green" id="r-add" aria-label="Add a recipe">${ic("plus")}</button></div>`;
  if (!n){ view.innerHTML = head + emptyState(); view.querySelector("#r-add").onclick = () => openForm(null); return; }
  const q = norm(S.q);
  const chips = [["all","All"], ...MEALS.map(m => [m.key, m.label]), ["saved","Saved"]].map(([k, l]) =>
    `<button class="chip ${MEALS.some(m => m.key === k) ? "m-" + k : ""}" data-filter="${k}" aria-pressed="${S.filter === k}">${k === "saved" ? ic("bookmark") : k !== "all" ? `<span class="d"></span>` : ""}${l}</button>`).join("");
  let body = "";
  if (!q && S.filter === "all"){
    const favs = Object.values(S.recipes).filter(r => r.saved || (r.rating || 0) >= 8).sort((a, b) => (b.rating || 0) - (a.rating || 0));
    const carousel = favs.length ? favs : Object.values(S.recipes).filter(r => r.meal !== "bedtime").sort((a, b) => b.protein - a.protein).slice(0, 8);
    body += `<button class="banner" id="kitchen"><span class="bi">${ic("basket")}</span><span><strong>What can I cook right now?</strong><span>${S.pantry.size ? S.pantry.size + " ingredients in your kitchen" : "Tick what's at home, get dishes you can make"}</span></span>${ic("right", "chev")}</button>`;
    body += `<div class="sec"><h2>${favs.length ? "Your favourites" : "Most protein"}</h2><span>${favs.length ? "Saved and top-rated" : "Save dishes to pin them here"}</span></div>
      <div class="hscroll">${carousel.map(r => `<button class="rc tallcard" data-open="${esc(r.id)}">${tile(r, "tall", `<span class="ov-chip">${fmt(r.kcal)} kcal</span>`)}<span class="rc-nm">${esc(r.name)}</span><span class="rc-sub num">${fmt(r.protein)} g protein</span></button>`).join("")}</div>`;
    for (const m of MEALS){
      const list = sorted(m.key); if (!list.length) continue;
      body += `<div class="sec m-${m.key}"><h2>${m.label}</h2><span>${m.time} · ${list.length}</span></div><div class="grid">${list.map(rcard).join("")}</div>`;
    }
  } else {
    const list = Object.values(S.recipes)
      .filter(r => S.filter === "all" || (S.filter === "saved" ? r.saved : r.meal === S.filter))
      .filter(r => !q || norm(r.name).includes(q) || (r.ingredients || []).some(i => norm(i.item).includes(q)))
      .sort((a, b) => MEALS.findIndex(m => m.key === a.meal) - MEALS.findIndex(m => m.key === b.meal) || (a.order ?? 999) - (b.order ?? 999));
    body += list.length
      ? `<div class="sec"><h2>${q ? "Results" : S.filter === "saved" ? "Saved" : mealOf(S.filter).label}</h2><span>${list.length} ${list.length === 1 ? "dish" : "dishes"}</span></div><div class="grid">${list.map(rcard).join("")}</div>`
      : `<div class="empty" style="margin-top:18px"><strong>${S.filter === "saved" && !q ? "Nothing saved yet" : `No dish matches “${esc(S.q)}”`}</strong>${S.filter === "saved" && !q ? "Open a recipe and tap the bookmark to keep it here." : "Try a dish name or an ingredient, like “beef” or “feta”."}</div>`;
  }
  view.innerHTML = head + `<div class="search">${ic("search")}<input type="search" id="q" placeholder="Search dishes or ingredients" value="${esc(S.q)}" aria-label="Search recipes" autocomplete="off"></div><div class="chips">${chips}</div>` + body;
  const qi = view.querySelector("#q");
  qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; renderRecipes(); const nq = view.querySelector("#q"); nq.focus(); nq.setSelectionRange(p, p); };
  view.querySelector("#r-add").onclick = () => openForm(null);
  view.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { S.filter = b.dataset.filter; renderRecipes(); });
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openRecipe(b.dataset.open));
  const kb = view.querySelector("#kitchen"); kb && (kb.onclick = () => { S.kitchen = true; renderKitchen(); window.scrollTo({top:0}); });
}
function allIngredientNames(){
  const set = new Map();
  for (const r of Object.values(S.recipes)) for (const i of r.ingredients || []) if (i.q != null && !STAPLES.test(i.item)) set.set(norm(i.item), i.item);
  return [...set.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function coverage(r){
  const req = (r.ingredients || []).filter(i => i.q != null && !STAPLES.test(i.item));
  const have = req.filter(i => S.pantry.has(norm(i.item)));
  return {have:have.length, total:req.length, missing:req.filter(i => !S.pantry.has(norm(i.item))).map(i => i.item)};
}
function renderKitchen(){
  const groups = {};
  for (const [k, label] of allIngredientNames()){ const cat = (CATS.find(([, re]) => re.test(label)) || ["Pantry"])[0]; (groups[cat] = groups[cat] || []).push([k, label]); }
  const cats = [...CATS.map(c => c[0]), "Pantry"].filter(c => groups[c]).map(c => `<div class="kcat"><h3>${c}</h3><div class="kchips">${groups[c].map(([k, label]) => `<button class="kchip" data-pantry="${esc(k)}" aria-pressed="${S.pantry.has(k)}">${esc(label)}</button>`).join("")}</div></div>`).join("");
  const ranked = Object.values(S.recipes).map(r => ({r, c:coverage(r)})).filter(x => x.c.have > 0 && x.c.total).sort((a, b) => (b.c.have/b.c.total) - (a.c.have/a.c.total) || a.c.missing.length - b.c.missing.length);
  const rows = ranked.slice(0, 20).map(({r, c}) => `<button class="row krow" data-open="${esc(r.id)}">${tile(r, "sm")}<span class="row-tx"><span class="nm">${esc(r.name)}</span><span class="sub">${c.missing.length ? `${c.have} of ${c.total} · need ${esc(c.missing.slice(0, 2).join(", "))}${c.missing.length > 2 ? "…" : ""}` : `<b style="color:var(--green)">You have everything</b>`}</span><span class="bar"><span style="width:${Math.round(c.have/c.total*100)}%"></span></span></span>${ic("right", "chev")}</button>`).join("");
  view.innerHTML = `<button class="back" id="k-back">${ic("left")}Recipes</button>
    <div class="lt"><div class="lt-tx"><p class="kick">${S.pantry.size} ingredients ticked</p><h1>Your kitchen</h1></div>${S.pantry.size ? `<button class="txtbtn red" id="k-clear">Clear all</button>` : ""}</div>
    <p class="lead">Tap what you have at home. Dishes below rank by how much of each you can already make.</p>
    <section class="card kpanel">${cats}</section>
    <div class="sec"><h2>You can make</h2><span>${ranked.length ? ranked.length + " dishes" : ""}</span></div>
    ${rows ? `<div class="list">${rows}</div>` : `<div class="empty"><strong>Pick a few ingredients</strong>Matching dishes appear here as you tap.</div>`}`;
  view.querySelector("#k-back").onclick = () => { S.kitchen = false; renderRecipes(); window.scrollTo({top:0}); };
  const kc = view.querySelector("#k-clear"); kc && (kc.onclick = () => { S.pantry = new Set(); savePantry(); renderKitchen(); });
  view.querySelectorAll("[data-pantry]").forEach(b => b.onclick = () => { const k = b.dataset.pantry; S.pantry.has(k) ? S.pantry.delete(k) : S.pantry.add(k); savePantry(); renderKitchen(); });
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openRecipe(b.dataset.open));
}

// ---------- WEEK ----------
function renderWeek(){
  const range = `${dayDate(0).toLocaleDateString("en-GB", {day:"numeric", month:"short"})} – ${dayDate(6).toLocaleDateString("en-GB", {day:"numeric", month:"short"})}`;
  const head = `<div class="lt"><div class="lt-tx"><p class="kick">${range}</p><h1>This week</h1></div><button class="cbtn" id="w-shuf" aria-label="Shuffle a new week">${ic("shuffle")}</button></div>`;
  if (!hasRecipes()){ view.innerHTML = head + emptyState(); view.querySelector("#w-shuf").onclick = shuffleWeek; return; }
  const tots = DAYS.map(([d]) => dayTotals(d));
  const wk = tots.reduce((s, t) => s + t.k, 0), wp = tots.reduce((s, t) => s + t.p, 0), beef = tots.reduce((s, t) => s + t.beef, 0);
  const onT = tots.filter(t => t.filled && t.k >= LOW && t.k <= HIGH).length;
  const stats = `<div class="stats">
    <div class="st"><span class="l">Days on target</span><span class="v">${onT}<small> / 7</small></span><span class="dots7">${tots.map(t => `<i style="--st:${dayState(t) || "var(--s3)"}"></i>`).join("")}</span></div>
    <div class="st"><span class="l">Average per day</span><span class="v">${fmt(wk/7)}<small> kcal</small></span><span class="muted" style="font-size:12px">Target ${fmt(LOW)}–${fmt(HIGH)}</span></div>
    <div class="st"><span class="l">Protein per day</span><span class="v">${fmt(wp/7)}<small> g</small></span><span class="muted" style="font-size:12px">Aim for 110–145 g</span></div>
    <div class="st"><span class="l">Beef this week</span><span class="v" style="color:${beef > BEEF_CAP ? "var(--red)" : "inherit"}">${fmt(beef)}<small> / ${BEEF_CAP} g</small></span><span class="bar"><span style="width:${Math.min(100, beef/BEEF_CAP*100).toFixed(0)}%;background:${beef > BEEF_CAP ? "var(--red)" : "#ff8a6a"}"></span></span></div>
  </div>`;
  const strip = `<div class="days">${DAYS.map(([d], i) => `<button class="dy ${d === todayDay ? "today" : ""}" data-day="${d}" aria-pressed="${S.weekDay === d}" aria-label="${DAYS[i][1]}" style="--st:${dayState(tots[i]) || "var(--s3)"}"><span class="w">${d === todayDay ? "Today" : DAYS[i][1].slice(0, 3)}</span><span class="n">${dayDate(i).getDate()}</span><span class="d"></span></button>`).join("")}</div>`;
  const sd = S.weekDay, t = tots[DAYS.findIndex(x => x[0] === sd)];
  const rows = MEALS.map(m => {
    const r = getRec((S.plan[sd] || {})[m.key]);
    return `<button class="row m-${m.key}" data-pick="${sd}|${m.key}">${r ? tile(r, "sm") : `<span class="tile sm ph">${ic("plus")}</span>`}<span class="row-tx"><span class="ml">${m.label}</span><span class="nm ${r ? "" : "ph"}">${r ? esc(r.name) : "Choose a dish"}</span></span><span style="display:flex;align-items:center;gap:6px"><span class="kc">${r ? fmt(r.kcal) : ""}</span>${ic("right", "chev")}</span></button>`;
  }).join("");
  view.innerHTML = head + stats + strip + `
    <div class="sec"><h2>${dayName(sd)}</h2><span style="display:flex;align-items:center;gap:8px"><b class="num" style="color:var(--tx)">${fmt(t.k)} kcal</b>${statusPill(t)}</span></div>
    <div class="list">${rows}</div>
    <p class="muted" style="font-size:13px;margin:10px 4px 0">${fmt(t.p)} g protein${t.beef ? ` · ${fmt(t.beef)} g beef` : ""}. Tap a meal to swap it.</p>
    <div class="wk-actions"><button class="btn primary block" id="shuffle">${ic("shuffle")} Shuffle a new week</button><button class="btn danger block" id="clear">Clear the whole week</button></div>`;
  view.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { S.weekDay = b.dataset.day; renderWeek(); });
  view.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const [d, m] = b.dataset.pick.split("|"); openPicker(d, m); });
  view.querySelector("#shuffle").onclick = shuffleWeek;
  view.querySelector("#w-shuf").onclick = shuffleWeek;
  const cb = view.querySelector("#clear"); cb.onclick = () => armed(cb, "Tap again to clear all 7 days", () => { savePlan({}); toast("Week cleared"); });
}
function shuffleWeek(){
  const by = Object.fromEntries(MEALS.map(m => [m.key, sorted(m.key)]));
  if (MEALS.some(m => !by[m.key].length)){ toast("Add at least one recipe for every meal first"); return; }
  const pick = a => a[Math.floor(Math.random()*a.length)];
  for (let attempt = 0; attempt < 80; attempt++){
    const plan = {}; let beef = 0, ok = true;
    for (const [d] of DAYS){
      let found = null;
      for (let i = 0; i < 300 && !found; i++){
        const c = {breakfast:pick(by.breakfast), lunch:pick(by.lunch), dinner:pick(by.dinner), bedtime:pick(by.bedtime)};
        const k = Object.values(c).reduce((s, r) => s + r.kcal, 0), b = Object.values(c).reduce((s, r) => s + beefG(r), 0);
        if (k >= 1750 && k <= 2000 && beef + b <= BEEF_CAP){ found = c; beef += b; }
      }
      if (!found){ ok = false; break; }
      plan[d] = Object.fromEntries(Object.entries(found).map(([m, r]) => [m, r.id]));
    }
    if (ok){ savePlan(plan); toast("New week planned"); return; }
  }
  toast("Couldn't fit a week in range with these recipes");
}

// ---------- SHOP ----------
function renderShop(){
  const head = n => `<div class="lt"><div class="lt-tx"><p class="kick">${n ? n + " items · this week's plan" : "This week's plan"}</p><h1>Shopping</h1></div></div>` + shopSeg();
  if (!hasRecipes()){ view.innerHTML = head(0) + emptyState(); return; }
  if (S.shopTab === "lists") return renderTrips();
  const agg = new Map();
  for (const [d] of DAYS) for (const m of MEALS){
    const r = getRec((S.plan[d] || {})[m.key]); if (!r || r.id === "out") continue;
    for (const i of r.ingredients || []){
      const u = i.u === "tbsp" ? "tsp" : i.u, q = i.q == null ? null : i.u === "tbsp" ? i.q * 3 : i.q;
      const key = norm(i.item) + "|" + (q == null ? "" : u);
      const e = agg.get(key) || {item:i.item, u, q:q == null ? null : 0};
      if (q != null) e.q += q; agg.set(key, e);
    }
  }
  if (!agg.size){ view.innerHTML = head(0) + `<div class="empty"><strong>No meals planned</strong>Fill in the Week tab and your shopping list builds itself here.</div>`; return; }
  const bought = lsGet("shop-bought", {});
  const groups = {}, home = [];
  for (const [key, e] of agg){
    if (S.pantry.has(norm(e.item))){ home.push([key, e]); continue; }
    const cat = (CATS.find(([, re]) => re.test(e.item)) || ["Pantry & spices"])[0]; (groups[cat] = groups[cat] || []).push([key, e]);
  }
  const total = agg.size - home.length;
  const done = [...agg.keys()].filter(k => bought[k] && !S.pantry.has(norm(agg.get(k).item))).length;
  const row = ([key, e], inHome) => {
    const t = e.q == null ? {q:"", t:e.item} : e.u === "tsp" && e.q >= 6 ? ingText({q:Math.round(e.q/3*2)/2, u:"tbsp", item:e.item}) : ingText({q:e.q, u:e.u, item:e.item});
    const on = inHome || !!bought[key];
    return `<div class="row srow ${on ? "done" : ""}" ${inHome ? "" : `data-key="${esc(key)}" role="checkbox" aria-checked="${on}" tabindex="0"`}><span class="ck ${on ? "on" : ""}" style="${inHome ? "opacity:.5" : ""}">${ic("check")}</span><span class="row-tx"><span class="nm">${esc(t.t)}</span></span><span class="q">${esc(t.q)}</span><a class="wmini" href="${WOLT}?search=${encodeURIComponent(e.item)}" target="_blank" rel="noopener" aria-label="Find ${esc(e.item)} on Wolt">${ic("search")}</a></div>`;
  };
  const secs = [...CATS.map(c => c[0]), "Pantry & spices"].filter(c => groups[c]).map(c => `<h3 class="shop-h">${c}</h3><div class="list">${groups[c].sort((a, b) => a[1].item.localeCompare(b[1].item)).map(x => row(x, false)).join("")}</div>`).join("");
  view.innerHTML = head(total) + `
    <section class="card prog"><div class="prog-top"><span class="big">${done}<small> / ${total} in the basket</small></span><button class="txtbtn" id="reset" style="font-size:14px;min-height:0;padding:0">Uncheck all</button></div><div class="bar"><span style="width:${total ? (done/total*100).toFixed(0) : 0}%"></span></div></section>
    <a class="wolt" href="${WOLT}" target="_blank" rel="noopener"><span class="wi">${ic("scooter")}</span><span><strong>Order from Agrohub on Wolt</strong><span>Delivered in Tbilisi</span></span>${ic("arrow", "arr")}</a>
    ${secs}
    ${home.length ? `<h3 class="shop-h">Already in your kitchen</h3><div class="list">${home.map(x => row(x, true)).join("")}</div>` : ""}
    <p class="muted" style="font-size:13px;margin:14px 4px 0">Amounts cover one serving of every planned meal. The blue search button opens that item on Wolt.</p>`;
  const toggle = el => { const b = lsGet("shop-bought", {}); const k = el.dataset.key; b[k] ? delete b[k] : b[k] = 1; lsSet("shop-bought", b); renderShop(); };
  view.querySelectorAll(".srow[data-key]").forEach(el => { el.onclick = e => { if (!e.target.closest("a")) toggle(el); }; el.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(el); } }; });
  view.querySelector("#reset").onclick = () => { lsSet("shop-bought", {}); renderShop(); };
}

const STORES = ["Agrohub", "Carrefour", "Nikora", "Spar", "Goodwill"];
const WD = ["sun","mon","tue","wed","thu","fri","sat"];
const keyDate = k => new Date(k + "T12:00");
const addDays = (k, n) => { const d = keyDate(k); d.setDate(d.getDate() + n); return dateKey(d); };
const fmtMoney = v => (Math.round(v * 100) / 100).toFixed(Math.round(v * 100) % 100 ? 2 : 0);
function whenLabel(t){
  const rel = t.date === todayKey ? "Today" : t.date === addDays(todayKey, 1) ? "Tomorrow" : t.date === addDays(todayKey, -1) ? "Yesterday" : keyDate(t.date).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
  return rel + (t.time ? " · " + t.time : "");
}
function nextHour(){ const d = new Date(); d.setHours(d.getHours() + 1, 0, 0, 0); return pad(d.getHours()) + ":00"; }
const catOf = item => (CATS.find(([, re]) => re.test(item)) || ["Pantry & spices"])[0];
const CAT_ORDER = [...CATS.map(c => c[0]), "Pantry & spices", "Other"];
function qtyLine(e){
  if (e.qtext != null) return {t:e.item, q:e.qtext};
  if (e.q == null) return {t:e.item, q:""};
  return e.u === "tsp" && e.q >= 6 ? ingText({q:Math.round(e.q/3*2)/2, u:"tbsp", item:e.item}) : ingText({q:e.q, u:e.u, item:e.item});
}
// Everything needed for the planned meals on the chosen weekdays, added up.
function aggItems(days){
  const agg = new Map(); let meals = 0;
  for (const d of days) for (const m of MEALS){
    const r = getRec((S.plan[d] || {})[m.key]); if (!r || r.id === "out") continue; meals++;
    for (const i of r.ingredients || []){
      const u = i.u === "tbsp" ? "tsp" : i.u, q = i.q == null ? null : i.u === "tbsp" ? i.q * 3 : i.q;
      const key = norm(i.item) + "|" + (q == null ? "" : u);
      const e = agg.get(key) || {key, item:i.item, u, q:q == null ? null : 0, cat:catOf(i.item), done:false};
      if (q != null) e.q = Math.round((e.q + q) * 100) / 100;
      agg.set(key, e);
    }
  }
  return {items:[...agg.values()], meals};
}
function saveTrip(t){ S.trips = [...S.trips.filter(x => x.id !== t.id), t]; write("trips/" + t.id, t); }
const shopSeg = () => `<div class="seg2" style="margin:-4px 0 16px" role="tablist"><button role="tab" data-shoptab="lists" aria-selected="${S.shopTab === "lists"}">Shopping lists</button><button role="tab" data-shoptab="week" aria-selected="${S.shopTab === "week"}">Whole week</button></div>`;
function tripRow(t){
  const items = t.items || [], n = items.length, got = items.filter(i => i.done).length, d = keyDate(t.date), done = t.status === "done";
  return `<button class="row trow" data-trip="${esc(t.id)}"><span class="tdate ${t.date === todayKey && !done ? "today" : ""} ${done ? "past" : ""}"><b>${d.getDate()}</b><span>${d.toLocaleDateString("en-GB", {month:"short"})}</span></span>
    <span class="row-tx"><span class="nm">${esc(t.store || "Shopping list")}</span><span class="sub">${done ? `${t.spent ? "₾" + fmtMoney(t.spent) + " · " : ""}${got} of ${n} bought · ${esc(whenLabel(t))}` : `${esc(whenLabel(t))} · ${got}/${n} in the basket`}</span>${!done && n ? `<span class="bar"><span style="width:${Math.round(got/n*100)}%"></span></span>` : ""}</span>${ic("right", "chev")}</button>`;
}
function renderTrips(){
  const up = S.trips.filter(t => t.status !== "done").sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));

const root = document.getElementById("sheet-root");
let lastFocus = null;
function onEsc(e){ if (e.key === "Escape") closeSheet(); }
function closeSheet(){ root.innerHTML = ""; document.documentElement.classList.remove("lock"); document.removeEventListener("keydown", onEsc); S.dId = null; lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true}); }
function sheet(html, cls = ""){
  let ov = root.querySelector(".ov");
  if (!ov){
    lastFocus = document.activeElement;
    root.innerHTML = `<div class="ov"><div class="sheet anim" role="dialog" aria-modal="true"></div></div>`;
    ov = root.querySelector(".ov");
    ov.addEventListener("click", e => { if (e.target === ov) closeSheet(); });
    document.addEventListener("keydown", onEsc);
    document.documentElement.classList.add("lock");

  const el = ov.querySelector(".sheet");
  el.className = "sheet anim " + cls;
  el.innerHTML = html;
  return el;
}

  el.querySelector("#d-today").onclick = () => { const p = clonePlan(); p[todayDay] = {...(p[todayDay] || {})}; p[todayDay][r.meal] = onToday ? "" : r.id; savePlan(p); toast(onToday ? "Removed from today" : `Set as today's ${m.label.toLowerCase()}`); re(); };
  const ph = el.querySelector("#d-photo"); ph && (ph.onchange = () => ph.files[0] && uploadPhoto(r, ph.files[0]));
  const dv = el.querySelector("#d-vid"); dv && (dv.onclick = () => {
    const id = r.video.id;
    dv.outerHTML = `<div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0" title="${esc(r.video.title || r.name)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><a class="vlink" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Open in YouTube ${ic("arrow")}</a>`;
  });
  el.querySelector("#d-edit").onclick = () => openForm(r);
  const del = el.querySelector("#d-del");
  del.onclick = () => armed(del, "Tap again to delete", async () => {
    del.disabled = true;
    try {
      await S.db.doc("recipes/" + r.id).delete();
      if (r.photo && S.assets) S.assets.delete(r.photo).catch(() => {});
      const p = clonePlan(); let ch = false; for (const d in p) for (const k in p[d]) if (p[d][k] === r.id){ p[d][k] = ""; ch = true; }
      if (ch) savePlan(p);
      closeSheet(); toast("Deleted " + r.name);
    } catch { del.disabled = false; toast("Couldn't delete. Try again."); }
  });
}

function videoCard(r){
