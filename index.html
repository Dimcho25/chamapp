// ---------- log a meal, with changes ----------
function openLogMeal(k){
  const m = mealOf(k); const prev = S.log.eaten[k]; const pobj = prev && typeof prev === "object" ? prev : null;
  const r = (pobj && getRec(pobj.id)) || getRec((S.plan[todayDay] || {})[k]);
  if (!r){ openPicker(todayDay, k); return; }
  const ings = r.ingredients || [];
  const removed = new Set(pobj?.removed || []); const amounts = {...(pobj?.amounts || {})}; let added = (pobj?.added || []).map(a => ({...a}));
  let manual = pobj && !ings.length ? pobj.kcal : r.kcal, showAdd = false, q = "";
  const calc = () => {
    if (!ings.length) return {kcal:Math.max(0, Math.round(manual || 0) + added.reduce((s, a) => s + (a.kcal || 0), 0)), protein:Math.round((r.protein || 0) + added.reduce((s, a) => s + (a.protein || 0), 0)), note:added.map(a => "+ " + a.item).join(" · ")};
    let kc = r.kcal, pr = r.protein || 0; const notes = [];
    for (const i of ings){
      const key = norm(i.item);
      if (removed.has(key)){ const n = nutrOf(i); if (n){ kc -= n.k; pr -= n.p; } notes.push("no " + i.item); continue; }
      const a = amounts[key];
      if (a != null && i.q != null && a !== i.q){ const n0 = nutrOf(i), n1 = nutrOf(i, a); if (n0 && n1){ kc += n1.k - n0.k; pr += n1.p - n0.p; } notes.push(`${i.item} ${fmtQ(a)}${i.u === "pc" ? "" : " " + i.u}`); }
    }
    for (const a of added){ kc += a.kcal || 0; pr += a.protein || 0; notes.push("+ " + a.item); }
    return {kcal:Math.max(0, Math.round(kc)), protein:Math.max(0, Math.round(pr)), note:notes.join(" · ")};
  };
  const delta = i => {
    const key = norm(i.item);
    if (removed.has(key)){ const n = nutrOf(i); return n ? -Math.round(n.k) : null; }
    const a = amounts[key]; if (a == null || i.q == null || a === i.q) return 0;
    const n0 = nutrOf(i), n1 = nutrOf(i, a); return n0 && n1 ? Math.round(n1.k - n0.k) : null;
  };
  const dk = d => d ? `<span class="dk ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${Math.abs(d)} kcal</span>` : d === null ? `<span class="dk">no calorie data</span>` : "";
  const matches = () => {
    const t = norm(q);
    const alias = Object.entries(ALIASES).filter(([w]) => w.startsWith(t) || t.startsWith(w)).flatMap(([, v]) => v);
    const names = t ? [...new Set([...Object.keys(NUTR).filter(n => n.includes(t)).sort((a, b) => (b.startsWith(t) - a.startsWith(t)) || a.localeCompare(b)), ...alias])].filter(n => NUTR[n]).slice(0, 8) : POPULAR;
    return names.map(n => { const d = NUTR[n].d; const nn = nutrOf({item:n, u:d[1]}, d[0]) || {k:0}; return `<button class="row pick" data-addn="${esc(n)}" style="grid-template-columns:minmax(0,1fr) auto"><span class="row-tx"><span class="nm">${esc(n)}</span><span class="sub num">${fmtQ(d[0])}${d[1] === "pc" ? "" : " " + d[1]} · ${fmt(nn.k)} kcal</span></span>${ic("plus", "sel-ic")}</button>`; }).join("") || `<div class="row" style="grid-template-columns:1fr"><span class="muted">Nothing found. Add it as a custom item below.</span></div>`;
  };
  const draw = () => {
    const prevEl = root.querySelector(".sheet"); const sc = prevEl ? prevEl.scrollTop : 0;
    const c = calc();
    const rows = ings.map((i, n) => {
      const key = norm(i.item), off = removed.has(key), cur = amounts[key] ?? i.q;
      return `<div class="row lrow ${off ? "off" : ""}"><button class="ck ${off ? "" : "on"}" data-tog="${n}" aria-pressed="${!off}" aria-label="${off ? "Add back" : "Leave out"} ${esc(i.item)}">${ic("check")}</button>
        <span class="row-tx"><span class="nm" style="white-space:normal">${esc(i.item)}</span>${dk(delta(i))}</span>
        ${i.q != null ? `<span class="amt"><input type="number" inputmode="decimal" step="any" min="0" data-amt="${n}" value="${cur}" ${off ? "disabled" : ""} aria-label="Amount of ${esc(i.item)}"><span>${i.u === "pc" ? "" : esc(i.u)}</span></span>` : `<span class="dk">to taste</span>`}</div>`;
    }).join("");
    const addRows = added.map((a, n) => `<div class="row lrow"><button class="xbtn" data-rma="${n}" aria-label="Remove ${esc(a.item)}">${ic("x")}</button><span class="row-tx"><span class="nm" style="white-space:normal">${esc(a.item)}</span><span class="dk up">+${fmt(a.kcal)} kcal</span></span>${a.custom ? `<span class="dk">custom</span>` : `<span class="amt"><input type="number" inputmode="decimal" step="any" min="0" data-aamt="${n}" value="${a.q}" aria-label="Amount of ${esc(a.item)}"><span>${a.u === "pc" ? "" : esc(a.u)}</span></span>`}</div>`).join("");
    const el = sheet(`${sheetHead(r.name, (prev ? "Edit " : "Log ") + m.label.toLowerCase())}<div class="sh-pad">
      ${ings.length ? `<p class="muted" style="margin:0 0 10px;font-size:14px">Untick anything you left out, change amounts, or add something extra.</p><div class="list">${rows}</div>`
        : `<div class="field"><label for="l-man">About how many calories?</label><input type="number" id="l-man" inputmode="numeric" value="${manual || ""}"></div>`}
      ${added.length ? `<p class="kick" style="margin:16px 4px 8px">Added</p><div class="list">${addRows}</div>` : ""}
      ${showAdd ? `<div class="card addpanel"><input type="search" id="l-q" placeholder="Search: fries, cheese, egg…" value="${esc(q)}" autocomplete="off" aria-label="Search ingredients"><div class="list" id="l-list">${matches()}</div>
          <div class="split"><input type="text" id="l-cn" placeholder="Something else" aria-label="Custom item name"><input type="number" id="l-ck" inputmode="numeric" placeholder="kcal" aria-label="Custom item calories"></div><button class="btn" id="l-cadd">Add custom item</button></div>`
        : `<button class="btn block" id="l-add" style="margin-top:10px">${ic("plus")} Add an ingredient</button>`}
      <div class="sh-actions"><button class="btn" id="l-swap">${ic("swap")} Swap dish</button>${prev ? `<button class="btn danger" id="l-undo">Not eaten</button>` : ""}</div>
    </div>
    <div class="lsum"><div class="tot"><span>${c.note ? "With your changes" : "As planned"}</span><span><b class="num">${fmt(c.kcal)}</b> kcal · ${fmt(c.protein)} g protein</span></div><button class="btn primary block" id="l-save">${ic("check")} ${prev ? "Save changes" : "Log " + m.label.toLowerCase()}</button></div>`);
    el.scrollTop = sc;
    wireClose(el);
    el.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { const key = norm(ings[+b.dataset.tog].item); removed.has(key) ? removed.delete(key) : removed.add(key); draw(); });
    el.querySelectorAll("[data-amt]").forEach(inp => inp.onchange = () => { const i = ings[+inp.dataset.amt], v = parseFloat(String(inp.value).replace(",", ".")); const key = norm(i.item); if (isNaN(v)) delete amounts[key]; else amounts[key] = v; draw(); });
    el.querySelectorAll("[data-rma]").forEach(b => b.onclick = () => { added = added.filter((_, n) => n !== +b.dataset.rma); draw(); });
    el.querySelectorAll("[data-aamt]").forEach(inp => inp.onchange = () => { const a = added[+inp.dataset.aamt], v = parseFloat(String(inp.value).replace(",", ".")); if (!isNaN(v)){ const n = nutrOf({item:a.item, u:a.u}, v); a.q = v; if (n){ a.kcal = Math.round(n.k); a.protein = Math.round(n.p*10)/10; } } draw(); });
    const man = el.querySelector("#l-man"); man && (man.onchange = () => { manual = Number(man.value) || 0; draw(); });
    const la = el.querySelector("#l-add"); la && (la.onclick = () => { showAdd = true; draw(); setTimeout(() => { const s = root.querySelector("#l-q"); s && s.focus(); }, 60); });
    const wireMatches = () => el.querySelectorAll("[data-addn]").forEach(b => b.onclick = () => { const n = b.dataset.addn, d = NUTR[n].d, nn = nutrOf({item:n, u:d[1]}, d[0]) || {k:0, p:0}; added.push({item:n, q:d[0], u:d[1], kcal:Math.round(nn.k), protein:Math.round(nn.p*10)/10}); showAdd = false; q = ""; draw(); });
    wireMatches();
    const lq = el.querySelector("#l-q"); lq && (lq.oninput = () => { q = lq.value; el.querySelector("#l-list").innerHTML = matches(); wireMatches(); });
    const lc = el.querySelector("#l-cadd"); lc && (lc.onclick = () => { const n = el.querySelector("#l-cn").value.trim(), kc = Number(el.querySelector("#l-ck").value); if (!n || !(kc > 0)){ toast("Add a name and its calories"); return; } added.push({item:n, kcal:Math.round(kc), protein:0, custom:true}); showAdd = false; q = ""; draw(); });
    el.querySelector("#l-swap").onclick = () => openPicker(todayDay, k);
    const lu = el.querySelector("#l-undo"); lu && (lu.onclick = () => { const e = {...S.log.eaten}; delete e[k]; S.log.eaten = e; saveLog(); closeSheet(); toast(`${m.label} unticked`); });
    el.querySelector("#l-save").onclick = () => {
      const c2 = calc(); const amts = {};
      for (const i of ings){ const key = norm(i.item); if (amounts[key] != null && amounts[key] !== i.q && !removed.has(key)) amts[key] = amounts[key]; }
      S.log.eaten = {...S.log.eaten, [k]:{id:r.id, name:r.name, kcal:c2.kcal, protein:c2.protein, note:c2.note, removed:[...removed], amounts:amts, added}};
      saveLog(); closeSheet(); toast(`Logged ${r.name} · ${fmt(c2.kcal)} kcal`);
    };
  };
  draw();
}

// ---------- drinks ----------
function openDrink(){
  let sel = "coffee", counts = {...DRINKS[0].def}, n = 1, save = false;
  const d = () => DRINKS.find(x => x.id === sel);
  const total = () => { const dr = d(); let k = dr.kcal, p = dr.p || 0; for (const a of dr.add || []){ const c = counts[a] || 0; k += c * ADDINS[a].k; p += c * (ADDINS[a].p || 0); } return {k:Math.round(k*n), p:Math.round(p*n*10)/10}; };
  const name = () => { const dr = d(); const parts = (dr.add || []).filter(a => counts[a]).map(a => `${counts[a]} ${ADDINS[a].u} ${ADDINS[a].l.toLowerCase()}`); return dr.name + (parts.length ? " · " + parts.join(", ") : "") + (n > 1 ? ` ×${n}` : ""); };
  const draw = () => {
    const prevEl = root.querySelector(".sheet"); const sc = prevEl ? prevEl.scrollTop : 0;
    const dr = d(), t = total();
    const saved = S.drinks.length ? `<p class="kick" style="margin:4px 4px 8px">My drinks</p><div class="list" style="margin-bottom:16px">${S.drinks.map((x, i) => `<div class="row sdrow"><span class="row-tx"><span class="nm" style="white-space:normal">${esc(x.name)}</span></span><span class="kc">${fmt(x.kcal)}</span><button class="minibtn" data-slog="${i}">Log</button><button class="xbtn" data-sdel="${i}" aria-label="Remove ${esc(x.name)} from my drinks">${ic("x")}</button></div>`).join("")}</div>` : "";
    const steps = (dr.add || []).map(a => { const A = ADDINS[a], c = counts[a] || 0; return `<div class="step"><span><span class="sl">${A.l}</span><br><span class="su">${A.k < 1 ? Math.round(A.k*100) + " kcal per 100 " + A.u : A.k + " kcal per " + A.u}</span></span><span class="stepper"><button data-dec="${a}" aria-label="Less ${A.l}">${ic("minus")}</button><b>${c} ${A.u}</b><button data-inc="${a}" aria-label="More ${A.l}">${ic("plus")}</button></span></div>`; }).join("");
    const el = sheet(`${sheetHead("Log a drink", "Today")}<div class="sh-pad">
      ${saved}
      <div class="dgrid">${DRINKS.map(x => `<button class="dchip" data-drink="${x.id}" aria-pressed="${x.id === sel}"><span class="e">${x.e}</span>${esc(x.name)}</button>`).join("")}</div>
      <div class="list" style="margin-top:14px">${steps}<div class="step"><span class="sl">How many</span><span class="stepper"><button data-n="-1" aria-label="Fewer">${ic("minus")}</button><b>${n}</b><button data-n="1" aria-label="More">${ic("plus")}</button></span></div></div>
      <div class="dtotal"><span>${esc(name())}</span><b class="num">${fmt(t.k)} <small style="font-size:15px;color:var(--tx2)">kcal</small></b></div>
      <label class="chk"><input type="checkbox" id="d-keep" ${save ? "checked" : ""}> Save to my drinks for one-tap logging</label>
      <button class="btn primary block" id="d-log" style="margin-top:14px">${ic("check")} Log drink</button>
    </div>`);
    el.scrollTop = sc;
    wireClose(el);
    el.querySelectorAll("[data-drink]").forEach(b => b.onclick = () => { sel = b.dataset.drink; counts = {...(d().def || {})}; n = 1; draw(); });
    el.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { const a = b.dataset.inc; counts[a] = (counts[a] || 0) + ADDINS[a].s; draw(); });
    el.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const a = b.dataset.dec; counts[a] = Math.max(0, (counts[a] || 0) - ADDINS[a].s); draw(); });
    el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { n = Math.max(1, n + +b.dataset.n); draw(); });
    el.querySelector("#d-keep").onchange = e => { save = e.target.checked; };
    el.querySelectorAll("[data-slog]").forEach(b => b.onclick = () => { const x = S.drinks[+b.dataset.slog]; S.log.extras = [...S.log.extras, {name:x.name, kcal:x.kcal, protein:x.protein || 0, kind:"drink"}]; saveLog(); closeSheet(); toast(`Logged ${x.name}`); });
    el.querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => { S.drinks = S.drinks.filter((_, i) => i !== +b.dataset.sdel); write("drinks/saved", {items:S.drinks}); draw(); render(); });
    el.querySelector("#d-log").onclick = () => {
      const t2 = total(), nm2 = name();
      S.log.extras = [...S.log.extras, {name:nm2, kcal:t2.k, protein:t2.p, kind:"drink"}];
      if (save && !S.drinks.some(x => x.name === nm2)){ S.drinks = [...S.drinks, {name:nm2, kcal:t2.k, protein:t2.p}]; write("drinks/saved", {items:S.drinks}); }
      saveLog(); closeSheet(); toast(`Logged ${nm2.split(" · ")[0]} · ${fmt(t2.k)} kcal`);
    };
  };
  draw();
}

function openTripForm(t){
  const isNew = !t || !t.items || t.isCopy;
  let date = t?.date || todayKey, time = t?.time || nextHour(), store = t?.store ?? "Agrohub";
  const defDays = k => [0, 1, 2].map(n => WD[(keyDate(k).getDay() + n) % 7]);
  let days = new Set(t?.days || defDays(date)), skip = true, touched = !!t;
  const order = DAYS.map(d => d[0]);
  const draw = () => {
    const prevEl = root.querySelector(".sheet"); const sc = prevEl ? prevEl.scrollTop : 0;
    const dateChips = Array.from({length:8}, (_, i) => { const k = addDays(todayKey, i); return `<button type="button" class="chip" data-tfd="${k}" aria-pressed="${k === date}">${i === 0 ? "Today" : i === 1 ? "Tomorrow" : keyDate(k).toLocaleDateString("en-GB", {weekday:"short", day:"numeric"})}</button>`; }).join("");
    const storeChips = STORES.map(x => `<button type="button" class="chip" data-tfs="${x}" aria-pressed="${x === store}">${x}</button>`).join("");
    const dayChips = DAYS.map(([d, l]) => `<button type="button" class="chip" data-tfday="${d}" aria-pressed="${days.has(d)}">${l.slice(0, 3)}</button>`).join("");
    const pv = aggItems(order.filter(d => days.has(d))); const n = pv.items.filter(e => !(skip && S.pantry.has(norm(e.item)))).length;
    const showMeals = !t || t.isCopy === undefined && !t.items;
    const el = sheet(`${sheetHead(t && t.items && !t.isCopy ? "Edit shopping list" : t?.isCopy ? "Shop again" : "New shopping list", "Shopping")}<form class="sh-pad" id="tf" novalidate style="display:grid;gap:18px">
      <div class="field"><span class="lab">Day</span><div class="chips" style="padding-top:0;margin-inline:-18px;padding-inline:18px">${dateChips}</div>
        <div class="split"><input type="date" id="tf-date" value="${date}" aria-label="Date"><input type="time" id="tf-time" value="${time}" aria-label="Time"></div></div>
      <div class="field"><span class="lab">Where</span><div class="kchips">${storeChips}</div><input type="text" id="tf-store" placeholder="Or type another shop" value="${STORES.includes(store) ? "" : esc(store)}" autocomplete="off"></div>
      ${showMeals ? `<div class="field"><span class="lab">Buy for the meals on</span><div class="daychips">${dayChips}</div>
        <label class="chk" style="margin:4px 2px 0"><input type="checkbox" id="tf-skip" ${skip ? "checked" : ""}> Leave out what's already in my kitchen</label>
        <p class="muted" style="margin:2px 4px 0;font-size:14px">${days.size ? `<b style="color:var(--tx)">${n} items</b> for ${pv.meals} planned meals. You can add more after.` : "No days picked, so the list starts empty and you add items yourself."}</p></div>` : t?.isCopy ? `<p class="muted" style="margin:0 4px;font-size:14px">${t.items.length} items copied from your last shop, all unticked.</p>` : ""}
      <button class="btn primary block" type="submit">${isNew ? "Create list" : "Save"}</button></form>`);
    el.scrollTop = sc; wireClose(el);
    el.querySelectorAll("[data-tfd]").forEach(b => b.onclick = () => { date = b.dataset.tfd; if (!touched) days = new Set(defDays(date)); draw(); });
    el.querySelector("#tf-date").onchange = e => { if (e.target.value){ date = e.target.value; if (!touched) days = new Set(defDays(date)); draw(); } };
    el.querySelector("#tf-time").onchange = e => { time = e.target.value; };
    el.querySelectorAll("[data-tfs]").forEach(b => b.onclick = () => { store = b.dataset.tfs; draw(); });
    const st = el.querySelector("#tf-store"); st.oninput = () => { store = st.value.trim() || "Agrohub"; el.querySelectorAll("[data-tfs]").forEach(x => x.setAttribute("aria-pressed", x.dataset.tfs === store && !st.value.trim() ? "true" : "false")); };
    el.querySelectorAll("[data-tfday]").forEach(b => b.onclick = () => { const d = b.dataset.tfday; days.has(d) ? days.delete(d) : days.add(d); touched = true; draw(); });
    const sk = el.querySelector("#tf-skip"); sk && (sk.onchange = () => { skip = sk.checked; draw(); });
    el.querySelector("#tf").onsubmit = e => {
      e.preventDefault();
      time = el.querySelector("#tf-time").value || time; date = el.querySelector("#tf-date").value || date;
      if (t && t.items && !t.isCopy){ saveTrip({...t, date, time, store}); toast("List updated"); openTrip(t.id); render(); return; }
      const id = "t" + Date.now().toString(36);
      const items = t?.isCopy ? t.items : aggItems(order.filter(d => days.has(d))).items.filter(it => !(skip && S.pantry.has(norm(it.item))));
      saveTrip({id, store, date, time, days:t?.isCopy ? (t.days || []) : order.filter(d => days.has(d)), items, status:"planned", createdAt:new Date().toISOString()});
      toast(`List for ${whenLabel({date, time})} created`); openTrip(id); render();
    };
  };
  draw();
}

function openTrip(id, keep = false, mode = ""){
  const t = S.trips.find(x => x.id === id); if (!t){ closeSheet(); return; }
  const prevEl = root.querySelector(".sheet"); const sc = keep && prevEl ? prevEl.scrollTop : 0;
  const items = t.items || [], n = items.length, got = items.filter(i => i.done).length, done = t.status === "done";
  const row = ([it, idx]) => { const l = qtyLine(it); return `<div class="row srow ${it.done && !done ? "done" : ""}" ${done ? "" : `data-ti="${idx}" role="checkbox" aria-checked="${!!it.done}" tabindex="0"`}><span class="ck ${it.done ? "on" : ""}">${ic("check")}</span><span class="row-tx"><span class="nm" style="white-space:normal">${esc(l.t)}</span></span><span class="q">${esc(l.q)}</span>${done ? "" : `<button class="xbtn" data-tdel="${idx}" aria-label="Remove ${esc(it.item)}">${ic("x")}</button>`}</div>`; };
  const grouped = list => { const g = {}; list.forEach(x => (g[x[0].cat || "Other"] = g[x[0].cat || "Other"] || []).push(x)); return CAT_ORDER.filter(c => g[c]).map(c => `<h3 class="shop-h">${c}</h3><div class="list">${g[c].sort((a, b) => a[0].item.localeCompare(b[0].item)).map(row).join("")}</div>`).join(""); };
  const pairs = items.map((it, idx) => [it, idx]);
  const head = `<div class="grab"></div><div class="sh-h"><div style="flex:1;min-width:0"><p class="kick">${esc(whenLabel(t))}</p><h2>${esc(t.store || "Shopping list")}</h2></div>${done || mode ? "" : `<button class="cbtn" id="t-edit" aria-label="Change day, time or shop">${ic("pencil")}</button>`}<button class="cbtn" data-close aria-label="Close">${ic("x")}</button></div>`;
  let body = "", foot = "";
  if (mode === "log"){
    body = `<section class="card" style="padding:16px;display:grid;gap:16px">
        <p style="margin:0;font-size:15px"><b>${got} of ${n}</b> items ticked.${n - got ? ` The other ${n - got} will be logged as not bought.` : " Everything on the list."}</p>
        <div class="field"><label for="tl-spent">How much did you spend? (optional)</label><div class="money"><span>₾</span><input type="number" inputmode="decimal" step="0.01" min="0" id="tl-spent" placeholder="0.00"></div></div>
        <label class="chk" style="margin:0"><input type="checkbox" id="tl-kitchen" checked> Add what I bought to my kitchen</label></section>
      <div class="sh-actions"><button class="btn" id="tl-back">Back</button><button class="btn primary" id="tl-save">${ic("check")} Log shop</button></div>`;
  } else if (done){
    const lt = t.loggedAt ? new Date(t.loggedAt).toLocaleString("en-GB", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
    const bought = pairs.filter(([it]) => it.done), missed = pairs.filter(([it]) => !it.done);
    body = `<section class="card" style="padding:16px;display:grid;gap:6px"><span class="kick" style="color:var(--green)">Logged ${esc(lt)}</span><span class="big">${t.spent ? "₾" + fmtMoney(t.spent) : got + " items"}</span><span class="muted" style="font-size:14px">${got} of ${n} items bought${t.addedToKitchen ? " · added to your kitchen" : ""}</span></section>
      ${bought.length ? `<p class="kick" style="margin:18px 4px 8px">Bought</p><div class="list">${bought.map(row).join("")}</div>` : ""}
      ${missed.length ? `<p class="kick" style="margin:18px 4px 8px">Not bought</p><div class="list">${missed.map(row).join("")}</div>` : ""}
      <div class="sh-actions"><button class="btn" id="t-again">${ic("shuffle")} Shop again</button><button class="btn danger" id="t-del">${ic("trash")} Delete</button></div>`;
  } else {
    body = `<section class="card prog" style="padding:14px 16px"><div class="prog-top"><span class="big">${got}<small> / ${n} in the basket</small></span>${got ? `<button class="txtbtn" id="t-reset" style="font-size:14px;min-height:0;padding:0">Untick all</button>` : ""}</div><div class="bar"><span style="width:${n ? (got/n*100).toFixed(0) : 0}%"></span></div></section>
      ${n ? grouped(pairs) : `<div class="empty" style="margin-top:14px"><strong>Empty list</strong>Add items below.</div>`}
      <form class="tadd" id="t-addf"><input type="text" id="t-addn" placeholder="Add an item" aria-label="Item to add" autocomplete="off"><input type="text" id="t-addq" placeholder="Amount" aria-label="Amount"><button class="btn" type="submit" aria-label="Add item">${ic("plus")}</button></form>
      ${/agrohub/i.test(t.store || "") ? `<a class="vlink" href="${WOLT}" target="_blank" rel="noopener">Or order it from Agrohub on Wolt ${ic("arrow")}</a>` : ""}
      <div class="sh-actions"><button class="btn danger" id="t-del">${ic("trash")} Delete list</button></div>`;
    foot = `<div class="lsum"><button class="btn primary block" id="t-log">${ic("check")} Log this shop${n ? ` · ${got}/${n}` : ""}</button></div>`;
  }
  const el = sheet(`${head}<div class="sh-pad">${body}</div>${foot}`, "full");
  el.scrollTop = sc; wireClose(el);
  const again = () => { openTrip(id, true, mode); if (S.view === "shop" || S.view === "today") render(); };
  const setItems = list => saveTrip({...t, items:list});
  el.querySelectorAll("[data-ti]").forEach(r => {
    const toggle = () => { const idx = +r.dataset.ti; setItems(items.map((it, i) => i === idx ? {...it, done:!it.done} : it)); again(); };
    r.onclick = e => { if (!e.target.closest("[data-tdel]")) toggle(); };
    r.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); } };
  });
  el.querySelectorAll("[data-tdel]").forEach(b => b.onclick = e => { e.stopPropagation(); const idx = +b.dataset.tdel; setItems(items.filter((_, i) => i !== idx)); again(); });
  const rs = el.querySelector("#t-reset"); rs && (rs.onclick = () => { setItems(items.map(it => ({...it, done:false}))); again(); });
  const af = el.querySelector("#t-addf"); af && (af.onsubmit = e => {
    e.preventDefault(); const name = el.querySelector("#t-addn").value.trim(); if (!name) return;
    const cat = (CATS.find(([, re]) => re.test(name)) || ["Other"])[0];
    setItems([...items, {key:"c" + Date.now().toString(36), item:name, qtext:el.querySelector("#t-addq").value.trim(), cat, done:false, custom:true}]);
    again(); setTimeout(() => { const i = root.querySelector("#t-addn"); i && i.focus(); }, 50);
  });
  const ed = el.querySelector("#t-edit"); ed && (ed.onclick = () => openTripForm(t));
  const lg = el.querySelector("#t-log"); lg && (lg.onclick = () => openTrip(id, false, "log"));
  const bk = el.querySelector("#tl-back"); bk && (bk.onclick = () => openTrip(id));
  const sv = el.querySelector("#tl-save"); sv && (sv.onclick = () => {
    const sp = parseFloat(String(el.querySelector("#tl-spent").value).replace(",", "."));
    const kitchen = el.querySelector("#tl-kitchen").checked;
    if (kitchen){ items.filter(i => i.done).forEach(i => S.pantry.add(norm(i.item))); savePantry(); }
    const now = new Date();
    saveTrip({...t, status:"done", plannedDate:t.date, plannedTime:t.time, date:todayKey, time:pad(now.getHours()) + ":" + pad(now.getMinutes()), loggedAt:now.toISOString(), loggedDate:todayKey, spent:isNaN(sp) ? null : Math.round(sp * 100) / 100, addedToKitchen:kitchen});
    toast(`Shop logged${isNaN(sp) ? "" : " · ₾" + fmtMoney(sp)}`); openTrip(id); render();
  });
  const ag = el.querySelector("#t-again"); ag && (ag.onclick = () => openTripForm({isCopy:true, store:t.store, days:t.days, items:items.map(it => ({...it, done:false}))}));
  const dl = el.querySelector("#t-del"); dl && (dl.onclick = () => armed(dl, "Tap again to delete", () => { S.trips = S.trips.filter(x => x.id !== id); write("trips/" + id, null, "delete"); closeSheet(); toast("List deleted"); render(); }));
}

async function shrink(file){
  try {
    const img = await createImageBitmap(file); const s = Math.min(1, 1200 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.82));
  } catch { return file; }
}
const imgType = b => /^image\/(jpeg|png|webp|gif)$/.test(b.type) ? b.type : "image/jpeg";
async function uploadPhoto(r, file){
  if (!S.assets) return;
  toast("Uploading photo…");
  try {
    const blob = await shrink(file);
    const up = await S.assets.upload(blob, {type:imgType(blob)});
    const old = r.photo;
    S.recipes[r.id] = {...r, photo:up.id};
    write("recipes/" + r.id, {photo:up.id}, "update");
    if (old) S.assets.delete(old).catch(() => {});
    toast("Photo saved"); openRecipe(r.id, true); render();
  } catch(e){ toast(e?.code === "too_large" ? "That photo is too big. Try a smaller one." : e?.code === "quota_or_state" ? "Photo storage is full" : "Couldn't upload the photo"); }
}

function openPicker(day, meal){
  const m = mealOf(meal); const cur = (S.plan[day] || {})[meal] || ""; const curR = getRec(cur);
  let all = sorted(meal);
  if (curR && curR.kcal) all = all.slice().sort((a, b) => (a.id === cur) - (b.id === cur) || Math.abs(a.kcal - curR.kcal) - Math.abs(b.kcal - curR.kcal));
  const rowHtml = r => { const d = curR && r.id !== cur ? r.kcal - curR.kcal : null; return `<button class="row pick ${r.id === cur ? "sel" : ""}" data-choose="${esc(r.id)}">${tile(r, "sm")}<span class="row-tx"><span class="nm">${esc(r.name)}</span><span class="sub num">${fmt(r.kcal)} kcal · ${fmt(r.protein)} g protein${isBeef(r) ? ` · ${fmt(beefG(r))} g beef` : ""}</span></span>${r.id === cur ? ic("check", "sel-ic") : d != null ? `<span class="diff num">${d === 0 ? "same" : (d > 0 ? "+" : "−") + Math.abs(d)}</span>` : r.rating ? `<span class="stars">${stars(r.rating)}</span>` : ""}</button>`; };
  const rows = all.map(rowHtml).join("");
  const out = meal === "lunch" || meal === "dinner" ? `<div class="list" style="margin-top:10px"><button class="row pick ${cur === "out" ? "sel" : ""}" data-choose="out">${tile(OUT, "sm")}<span class="row-tx"><span class="nm">Eating out</span><span class="sub">Counts as about 650 kcal</span></span>${cur === "out" ? ic("check", "sel-ic") : ""}</button></div>` : "";
  const el = sheet(`${sheetHead((cur ? "Swap " : "Choose ") + m.label.toLowerCase(), day === todayDay ? "Today" : dayName(day))}<div class="sh-pad">
    ${curR && cur !== "out" ? `<p class="muted" style="margin:0 0 10px;font-size:14px">Closest in calories to ${esc(curR.name)} first.</p>` : ""}
    <div class="search" style="margin-bottom:10px">${ic("search")}<input type="search" id="p-q" placeholder="Search ${all.length} ${m.label.toLowerCase()} dishes" autocomplete="off" aria-label="Search dishes"></div>
    <div class="list" id="p-list">${rows || `<div class="row"><span></span><span class="muted">No ${m.label.toLowerCase()} recipes yet</span></div>`}</div>${out}
    ${cur ? `<div class="sh-actions">${cur !== "out" ? `<button class="btn" id="p-view">View recipe</button>` : ""}<button class="btn danger" id="p-clear">Clear this meal</button></div>` : ""}</div>`);
  wireClose(el);
  const choose = id => { const p = clonePlan(); p[day] = {...(p[day] || {}), [meal]:id}; savePlan(p); closeSheet(); const nr = getRec(id); toast(`${day === todayDay ? "Today's" : dayName(day)} ${m.label.toLowerCase()}: ${nr ? nr.name : "updated"}`); };
  const wireChoose = () => el.querySelectorAll("[data-choose]").forEach(b => b.onclick = () => choose(b.dataset.choose));
  wireChoose();
  const pq = el.querySelector("#p-q"); pq.oninput = () => { const t = norm(pq.value); const list = all.filter(r => !t || norm(r.name).includes(t) || (r.ingredients || []).some(i => norm(i.item).includes(t))); el.querySelector("#p-list").innerHTML = list.map(rowHtml).join("") || `<div class="row" style="grid-template-columns:1fr"><span class="muted">No dish matches “${esc(pq.value)}”</span></div>`; wireChoose(); };
  const pv = el.querySelector("#p-view"); pv && (pv.onclick = () => openRecipe(cur));
  const pc = el.querySelector("#p-clear"); pc && (pc.onclick = () => { const p = clonePlan(); p[day] = {...(p[day] || {}), [meal]:""}; savePlan(p); closeSheet(); });
}

function openExtra(){
  const el = sheet(`${sheetHead("Log something else", "Today")}<form class="sh-pad" id="x-form" novalidate style="display:grid;gap:14px">
      <div class="field"><label for="x-name">What did you have?</label><input type="text" id="x-name" placeholder="Shawarma at Fabrika"></div>
      <div class="field"><label for="x-kcal">Calories</label><input type="number" id="x-kcal" inputmode="numeric" placeholder="400"></div>
      <div class="err" id="x-err"></div>
      <button class="btn primary block" type="submit">Add to today</button></form>`);
  wireClose(el);
  el.querySelector("#x-form").onsubmit = e => {
    e.preventDefault();
    const name = el.querySelector("#x-name").value.trim(), kcal = Number(el.querySelector("#x-kcal").value);
    if (!name || !(kcal > 0)){ el.querySelector("#x-err").textContent = "Add a name and its calories."; return; }
    S.log.extras = [...S.log.extras, {name, kcal:Math.round(kcal)}]; saveLog(); closeSheet(); toast(`Logged ${name}`);
  };
  setTimeout(() => el.querySelector("#x-name").focus(), 80);
}

function ingRowHtml(i = {item:"", q:"", u:"g"}){
  const u = i.q == null && i.item ? "to taste" : (i.u || "g");
  return `<div class="ingr"><input type="text" class="i-name" placeholder="Ingredient" value="${esc(i.item)}" aria-label="Ingredient"><input type="number" step="any" inputmode="decimal" class="i-q" placeholder="Qty" value="${i.q == null ? "" : esc(i.q)}" aria-label="Amount"><select class="i-u" aria-label="Unit">${UNITS.map(x => `<option ${x === u ? "selected" : ""}>${x}</option>`).join("")}</select><button type="button" class="rm" aria-label="Remove ingredient">${ic("x")}</button></div>`;
}
function openForm(r){
  const isNew = !r; let meal = r?.meal || "dinner", emoji = r?.emoji || "", photoFile = null;
  const preview = () => tile({id:r?.id || "new-dish", name:root.querySelector("#f-name")?.value ?? r?.name ?? "", meal, emoji, photo:r?.photo}, "md");
  const el = sheet(`<form class="form" id="f" novalidate>
      <div class="fh"><button type="button" class="txtbtn" id="f-cancel">Cancel</button><h2>${isNew ? "New recipe" : "Edit recipe"}</h2><button type="submit" class="txtbtn strong" id="f-save-top">Save</button></div>
      <div class="f-body">
        <div class="f-hero"><span id="f-tile"></span><div class="emo" aria-label="Pick an icon">${EMOS.map(e => `<button type="button" data-emo="${e}" aria-pressed="${e === emoji}">${e}</button>`).join("")}</div></div>
        <div class="field"><label for="f-name">Dish name</label><input type="text" id="f-name" value="${esc(r?.name || "")}" placeholder="Beef stroganoff with mash"></div>
        <div class="field"><span class="lab">Meal</span><div class="seg">${MEALS.map(m => `<button type="button" class="m-${m.key}" data-meal="${m.key}" aria-pressed="${m.key === meal}">${m.label}</button>`).join("")}</div></div>
        <div class="split"><div class="field"><label for="f-kcal">Calories</label><input type="number" id="f-kcal" inputmode="numeric" value="${r?.kcal ?? ""}" placeholder="600"></div><div class="field"><label for="f-protein">Protein (g)</label><input type="number" id="f-protein" inputmode="numeric" value="${r?.protein ?? ""}" placeholder="40"></div></div>
        ${S.assets ? `<div class="field"><span class="lab">Photo</span><label class="btn photo-btn">${ic("camera")}<span id="f-photo-l">${r?.photo ? "Replace the photo" : "Add a photo of the dish"}</span><input type="file" accept="image/*" id="f-photo" hidden></label></div>` : ""}
        <div class="field"><span class="lab">Ingredients for one serving</span><div id="f-ings">${(r?.ingredients?.length ? r.ingredients : [{item:"", q:"", u:"g"}, {item:"", q:"", u:"g"}]).map(ingRowHtml).join("")}</div><button type="button" class="btn" id="f-add" style="margin-top:4px">${ic("plus")} Add ingredient</button></div>
        <div class="field"><label for="f-yt">YouTube video (optional)</label><input type="text" id="f-yt" inputmode="url" autocomplete="off" placeholder="Paste a YouTube link" value="${r?.video?.id ? "https://youtu.be/" + esc(r.video.id) : ""}"></div>
        <div class="field"><label for="f-steps">How to make it</label><textarea id="f-steps" rows="5" placeholder="One short sentence per step.">${esc(r?.steps || "")}</textarea></div>
        <div class="err" id="f-err"></div>
        <button class="btn primary block" type="submit" id="f-save">${isNew ? "Save recipe" : "Save changes"}</button>
      </div></form>`, "full");
  el.scrollTop = 0;
  const box = el.querySelector("#f-ings");
  const wireRm = () => box.querySelectorAll(".rm").forEach(b => b.onclick = () => { if (box.children.length > 1) b.closest(".ingr").remove(); else b.closest(".ingr").querySelectorAll("input").forEach(i => i.value = ""); });
  wireRm();
  const refreshTile = () => { el.querySelector("#f-tile").innerHTML = preview(); };
  refreshTile();
  el.querySelector("#f-cancel").onclick = () => r ? openRecipe(r.id) : closeSheet();
  el.querySelector("#f-add").onclick = () => { box.insertAdjacentHTML("beforeend", ingRowHtml()); wireRm(); box.lastElementChild.querySelector("input").focus(); };
  el.querySelectorAll("[data-meal]").forEach(b => b.onclick = () => { meal = b.dataset.meal; el.querySelectorAll("[data-meal]").forEach(x => x.setAttribute("aria-pressed", x.dataset.meal === meal)); refreshTile(); });
  el.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => { emoji = emoji === b.dataset.emo ? "" : b.dataset.emo; el.querySelectorAll("[data-emo]").forEach(x => x.setAttribute("aria-pressed", x.dataset.emo === emoji)); refreshTile(); });
  el.querySelector("#f-name").addEventListener("input", () => { if (!emoji) refreshTile(); });
  const pf = el.querySelector("#f-photo"); pf && (pf.onchange = () => { photoFile = pf.files[0] || null; el.querySelector("#f-photo-l").textContent = photoFile ? photoFile.name : "Add a photo of the dish"; });
  el.querySelector("#f").onsubmit = async e => {
    e.preventDefault();
    const err = el.querySelector("#f-err");
    const name = el.querySelector("#f-name").value.trim(), kcal = Number(el.querySelector("#f-kcal").value), protein = Number(el.querySelector("#f-protein").value || 0);
    const ingredients = [...box.querySelectorAll(".ingr")].map(row => {
      const item = row.querySelector(".i-name").value.trim(), qs = row.querySelector(".i-q").value, u = row.querySelector(".i-u").value;
      if (!item) return null;
      if (u === "to taste" || qs === "") return {q:null, u:"", item};
      return {q:parseFloat(qs), u, item};
    }).filter(Boolean);
    const fail = msg => { err.textContent = msg; err.scrollIntoView({block:"center", behavior:"smooth"}); };
    if (!name) return fail("Give the dish a name.");
    if (!(kcal > 0)) return fail("Add the calories for one serving.");
    if (!ingredients.length) return fail("Add at least one ingredient.");
    if (!S.db) return fail("Saving isn't available right now.");
    const id = r?.id || (name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "dish") + "-" + Math.random().toString(36).slice(2, 6);
    const btns = el.querySelectorAll("#f-save,#f-save-top"); btns.forEach(b => b.disabled = true); err.textContent = "";
    let photo = r?.photo || null;
    try {
      if (photoFile && S.assets){ const blob = await shrink(photoFile); const up = await S.assets.upload(blob, {type:imgType(blob)}); if (photo) S.assets.delete(photo).catch(() => {}); photo = up.id; }
      const body = {id, name, meal, kcal:Math.round(kcal), protein:Math.round(protein), ingredients, steps:el.querySelector("#f-steps").value.trim(), order:r?.order ?? 900, rating:r?.rating || 0, saved:!!r?.saved};
      if (photo) body.photo = photo;
      if (emoji) body.emoji = emoji;
      const vid = ytId(el.querySelector("#f-yt").value);
      if (vid) body.video = {id:vid, title:(r?.video?.id === vid && r.video.title) || "How to make " + name};
      await S.db.doc("recipes/" + id).set(body);
      S.recipes[id] = body;
      toast(isNew ? "Recipe saved" : "Changes saved"); openRecipe(id); render();
    } catch(e2){ btns.forEach(b => b.disabled = false); fail(e2?.code === "quota_exceeded" ? "Storage is full. Delete a recipe first." : "Couldn't save. Check your connection and try again."); }
  };
  if (isNew) setTimeout(() => el.querySelector("#f-name").focus(), 80);
}

// ---------- boot ----------
setView(location.hash.slice(1) || "today");
(async () => {
  let db = null;
  try { db = window.claude && await window.claude.use("db"); } catch { db = null; }
  S.db = db;
  if (!db){ S.loaded = true; render(); return; }
  try { S.assets = await window.claude.use("assets"); } catch { S.assets = null; }
  db.collection("recipes").onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.name) next[d.id] = {...v, id:d.id}; });
    S.recipes = next; S.loaded = true; render();
  }, () => { S.loaded = true; render(); });
  db.doc("plan/week").onSnapshot(snap => { if (busy("plan/week")) return; const v = snap.exists ? snap.data() : null; S.plan = v && v.days ? JSON.parse(JSON.stringify(v.days)) : {}; if (S.loaded) render(); }, () => {});
  db.doc("pantry/main").onSnapshot(snap => { if (busy("pantry/main")) return; S.pantry = new Set(snap.exists ? (snap.data().items || []) : []); if (S.loaded && S.view !== "today") render(); }, () => {});
  db.doc("log/" + todayKey).onSnapshot(snap => { if (busy("log/" + todayKey)) return; const v = snap.exists ? snap.data() : {}; S.log = {eaten:{...(v.eaten || {})}, extras:[...(v.extras || [])], water:v.water || 0}; if (S.loaded && S.view === "today") render(); }, () => {});
  db.collection("trips").onSnapshot(snap => {
    const remote = snap.docs.map(d => d.data()).filter(t => t && t.id).map(t => JSON.parse(JSON.stringify(t)));
    S.trips = [...remote.filter(t => !busy("trips/" + t.id)), ...S.trips.filter(t => busy("trips/" + t.id))];
    if (S.loaded && (S.view === "shop" || S.view === "today")) render();
  }, () => {});
  db.doc("drinks/saved").onSnapshot(snap => { if (busy("drinks/saved")) return; S.drinks = snap.exists ? [...(snap.data().items || [])] : []; if (S.loaded && S.view === "today") render(); }, () => {});
  db.collection("weights").onSnapshot(snap => { S.weights = snap.docs.map(d => d.data()).filter(w => w && w.kg && w.date).sort((a, b) => a.date.localeCompare(b.date)); if (S.loaded && S.view === "today") render(); }, () => {});
})();
})();
</script>
